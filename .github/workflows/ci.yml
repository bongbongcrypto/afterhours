name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_STYLUS_VERSION: 0.10.9
  # Robinhood Chain testnet: Stylus v3, same ArbOS as mainnet. Used only to validate the wasm.
  CHECK_ENDPOINT: https://rpc.testnet.chain.robinhood.com

permissions:
  contents: write

jobs:
  fmt:
    # The development machine never runs the Rust toolchain, so rustfmt runs here
    # and pushes the formatted files back instead of failing the build.
    name: rustfmt
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: lockfile (committed for reproducible cargo-stylus builds; minimal update when deps change)
        run: cargo update --workspace
      - name: push formatting / lockfile if anything changed
        run: |
          git add -u
          git add Cargo.lock
          if git diff --cached --quiet; then echo "nothing to push"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: rustfmt / lockfile"
          git push

  test:
    name: clippy / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  stylus:
    name: wasm build + on-chain validation + ABI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cache cargo-stylus
        id: stylus-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ env.CARGO_STYLUS_VERSION }}-${{ runner.os }}
      - name: install cargo-stylus
        if: steps.stylus-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-stylus --version "$CARGO_STYLUS_VERSION" --locked
      - name: lockfile (minimal update; cargo-stylus builds --locked)
        run: cargo update --workspace
      - name: cargo stylus check (compiles to wasm, validates against the chain)
        run: cargo stylus check --endpoint "$CHECK_ENDPOINT"
      - name: export Solidity ABI and check the integrator interface against it
        run: |
          mkdir -p out
          cargo stylus export-abi > out/AfterHours.abi.sol
          cat out/AfterHours.abi.sol
          python3 scripts/abi_check.py out/AfterHours.abi.sol abi/IAfterHours.sol
      - name: collect wasm
        run: |
          ls -la target/wasm32-unknown-unknown/release/*.wasm
          cp target/wasm32-unknown-unknown/release/afterhours_oracle.wasm out/
          sha256sum out/afterhours_oracle.wasm | tee out/afterhours_oracle.wasm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-${{ github.sha }}
          path: out/
