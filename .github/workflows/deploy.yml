name: deploy

# Manual only. Deploys + activates the contract with cargo-stylus, then runs the
# one-shot `initialize` in the same job (seconds between deployment and
# configuration), then reads the configuration back and fails the job unless
# every field matches the inputs and the feed describes the expected asset.
# With `reproducible` on (default) the wasm is built in cargo-stylus' Docker
# image so `cargo stylus verify` and the explorer can match the source; off,
# it is built on the runner with `--no-verify`. Optionally creates a Morpho
# Blue market priced by the new oracle.
on:
  workflow_dispatch:
    inputs:
      network:
        description: robinhood-mainnet or robinhood-testnet
        required: true
        default: robinhood-testnet
        type: choice
        options: [robinhood-testnet, robinhood-mainnet]
      feed:
        description: Chainlink feed address for the stock
        required: true
      pool:
        description: Uniswap v3 pool address (stock / quote)
        required: true
      stock:
        description: Stock token address
        required: true
      expected_description:
        description: What feed.description() must return (measured on mainnet, see DEPLOYMENTS.md)
        required: true
        default: "Robinhood AAPL / USD"
      expected_quote:
        description: The pool's other token, which initialize derives (USDG on Robinhood Chain)
        required: true
        default: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
      expected_decimals:
        description: feed/stock/quote decimals initialize must read back
        required: true
        default: "8/18/6"
      live_max_age:
        description: Seconds a feed answer stays LIVE
        required: true
        default: "21600"
      twap_window:
        description: TWAP window in seconds
        required: true
        default: "1800"
      max_deviation_bps:
        description: Band around the last feed print, basis points
        required: true
        default: "1000"
      min_liquidity:
        description: Minimum window-averaged pool liquidity (AAPL 0.05% pool holds ~1.3-1.6e18)
        required: true
        default: "200000000000000000"
      max_anchor_age:
        description: Oldest feed print the band may anchor to, seconds (5 days covers holiday weekends)
        required: true
        default: "432000"
      reproducible:
        description: Build in cargo-stylus' Docker image so the explorer can verify the source (falls back to --no-verify when off)
        required: true
        default: true
        type: boolean
      morpho_lltv:
        description: If non-empty, also create a Morpho Blue market (loan = quote token, collateral = stock, oracle = AfterHours) at this LLTV in wei, e.g. 625000000000000000 for 62.5%. Leave empty to skip.
        required: false
        default: ""

env:
  CARGO_STYLUS_VERSION: 0.10.9
  # Morpho Blue + AdaptiveCurveIrm on Robinhood Chain (docs.morpho.org addresses page; IRM and
  # the standard LLTVs verified enabled on-chain 2026-09-19).
  MORPHO_BLUE: "0x9D53d5E3bd5E8d4Cbfa6DB1ca238AEA02E651010"
  MORPHO_IRM: "0x2BD3d5965B26B51814AC95127B2b80dD6CcC0fa1"
  MORPHO_LLTV: ${{ inputs.morpho_lltv }}
  NETWORK: ${{ inputs.network }}
  FEED: ${{ inputs.feed }}
  POOL: ${{ inputs.pool }}
  STOCK: ${{ inputs.stock }}
  EXPECTED_DESCRIPTION: ${{ inputs.expected_description }}
  EXPECTED_QUOTE: ${{ inputs.expected_quote }}
  EXPECTED_DECIMALS: ${{ inputs.expected_decimals }}
  LIVE_MAX_AGE: ${{ inputs.live_max_age }}
  TWAP_WINDOW: ${{ inputs.twap_window }}
  MAX_DEVIATION_BPS: ${{ inputs.max_deviation_bps }}
  MIN_LIQUIDITY: ${{ inputs.min_liquidity }}
  MAX_ANCHOR_AGE: ${{ inputs.max_anchor_age }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - name: cache cargo-stylus
        id: stylus-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ env.CARGO_STYLUS_VERSION }}-${{ runner.os }}
      - name: install cargo-stylus
        if: steps.stylus-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-stylus --version "$CARGO_STYLUS_VERSION" --locked
      - name: pick endpoint
        id: net
        run: |
          case "$NETWORK" in
            robinhood-mainnet) echo "rpc=https://rpc.mainnet.chain.robinhood.com" >> "$GITHUB_OUTPUT" ;;
            robinhood-testnet) echo "rpc=https://rpc.testnet.chain.robinhood.com" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown network $NETWORK"; exit 1 ;;
          esac
      - name: preflight (every read initialize will make, before any gas is spent)
        id: pre
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          desc=$(cast call --rpc-url "$RPC" "$FEED" "description()(string)")
          echo "feed description: $desc"
          test "$desc" = "\"$EXPECTED_DESCRIPTION\"" || { echo "feed is not $EXPECTED_DESCRIPTION"; exit 1; }
          cast call --rpc-url "$RPC" "$FEED" "latestRoundData()(uint80,int256,uint256,uint256,uint80)"
          cast call --rpc-url "$RPC" "$POOL" "token0()(address)"
          cast call --rpc-url "$RPC" "$POOL" "token1()(address)"
          cast call --rpc-url "$RPC" "$POOL" "observe(uint32[])(int56[],uint160[])" "[$TWAP_WINDOW,0]"
          cast call --rpc-url "$RPC" "$STOCK" "oraclePaused()(bool)"
          addr=$(cast wallet address --private-key "$DEPLOYER_KEY")
          bal=$(cast balance --rpc-url "$RPC" "$addr")
          echo "deployer $addr balance $bal wei"
          test "$bal" != "0" || { echo "deployer has no gas"; exit 1; }
          echo "deployer=$addr" >> "$GITHUB_OUTPUT"
      - name: deploy + activate
        id: deploy
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          set -o pipefail
          # Reproducible (Docker) builds let `cargo stylus verify` / the explorer match the source.
          if [ "${{ inputs.reproducible }}" = "true" ]; then flags=""; else flags="--no-verify"; fi
          cargo stylus deploy --endpoint "$RPC" --private-key "$DEPLOYER_KEY" $flags 2>&1 | tee deploy.log
          # cargo-stylus colours the address (ANSI codes sit between "address:" and "0x").
          addr=$(sed -E 's/\x1b\[[0-9;]*m//g' deploy.log | grep -oiE 'deployed code at address:? *0x[0-9a-fA-F]{40}' | grep -oE '0x[0-9a-fA-F]{40}' | tail -1)
          test -n "$addr" || { echo "no address in cargo stylus output"; exit 1; }
          echo "address=$addr" >> "$GITHUB_OUTPUT"
          sha256sum target/wasm32-unknown-unknown/release/afterhours_oracle.wasm || true
      - name: initialize (fails on a reverted receipt)
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          ADDR: ${{ steps.deploy.outputs.address }}
        run: |
          receipt=$(cast send --json --rpc-url "$RPC" --private-key "$DEPLOYER_KEY" "$ADDR" \
            "initialize(address,address,address,uint64,uint32,uint64,uint128,uint64)" \
            "$FEED" "$POOL" "$STOCK" "$LIVE_MAX_AGE" "$TWAP_WINDOW" "$MAX_DEVIATION_BPS" "$MIN_LIQUIDITY" "$MAX_ANCHOR_AGE")
          echo "$receipt" | jq -r '"initialize tx \(.transactionHash) status \(.status)"'
          echo "$receipt" | jq -e '.status == "0x1"' > /dev/null || { echo "initialize reverted"; exit 1; }
      - name: read back and verify every field
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          ADDR: ${{ steps.deploy.outputs.address }}
          DEPLOYER: ${{ steps.pre.outputs.deployer }}
        run: |
          echo "AfterHours deployed at $ADDR on $NETWORK"
          cast call --rpc-url "$RPC" "$ADDR" "config()(bool,address,address,address,address,address,bool,uint8,uint8,uint8,uint64,uint32,uint64,uint128,uint64)" > config.txt
          cat config.txt
          lower() { tr '[:upper:]' '[:lower:]'; }
          # cast prints one value per line, in order
          mapfile -t c < config.txt
          test "${c[0]}" = "true" || { echo "not initialized"; exit 1; }
          test "$(echo "${c[2]}" | lower)" = "$(echo "$FEED" | lower)" || { echo "feed mismatch"; exit 1; }
          test "$(echo "${c[3]}" | lower)" = "$(echo "$POOL" | lower)" || { echo "pool mismatch"; exit 1; }
          test "$(echo "${c[4]}" | lower)" = "$(echo "$STOCK" | lower)" || { echo "stock mismatch"; exit 1; }
          test "$(echo "${c[1]}" | lower)" = "$(echo "$DEPLOYER" | lower)" || { echo "initializer is not our deployer: ${c[1]}"; exit 1; }
          test "$(echo "${c[5]}" | lower)" = "$(echo "$EXPECTED_QUOTE" | lower)" || { echo "quote token mismatch: ${c[5]}"; exit 1; }
          test "${c[7]}/${c[8]}/${c[9]}" = "$EXPECTED_DECIMALS" || { echo "decimals mismatch: ${c[7]}/${c[8]}/${c[9]}"; exit 1; }
          num() { echo "$1" | sed 's/ .*//'; }   # cast appends "[2e17]" to large numbers
          test "$(num "${c[10]}")" = "$LIVE_MAX_AGE" || { echo "liveMaxAge mismatch"; exit 1; }
          test "$(num "${c[11]}")" = "$TWAP_WINDOW" || { echo "twapWindow mismatch"; exit 1; }
          test "$(num "${c[12]}")" = "$MAX_DEVIATION_BPS" || { echo "maxDeviationBps mismatch"; exit 1; }
          test "$(num "${c[13]}")" = "$MIN_LIQUIDITY" || { echo "minLiquidity mismatch"; exit 1; }
          test "$(num "${c[14]}")" = "$MAX_ANCHOR_AGE" || { echo "maxAnchorAge mismatch"; exit 1; }
          desc=$(cast call --rpc-url "$RPC" "$ADDR" "description()(string)")
          test "$desc" = "\"$EXPECTED_DESCRIPTION (AfterHours)\"" || { echo "description mismatch: $desc"; exit 1; }
          cast call --rpc-url "$RPC" "$ADDR" "decimals()(uint8)"
          cast call --rpc-url "$RPC" "$ADDR" "state()(uint8,uint8,uint256,uint256,uint256,uint256,uint128,bool)"
          # PAUSED / NO_DATA are legal at deploy time (weekend, thin pool); state() above says why.
          cast call --rpc-url "$RPC" "$ADDR" "latestRoundData()(uint80,int256,uint256,uint256,uint80)" \
            || echo "latestRoundData() reverted: the oracle is refusing to price right now (see state())"
          echo "all fields verified"
      - name: create a Morpho Blue market priced by AfterHours (optional)
        if: inputs.morpho_lltv != ''
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          ADDR: ${{ steps.deploy.outputs.address }}
        run: |
          # Market creation on Morpho Blue is permissionless once the IRM and LLTV are enabled;
          # loan token = the pool's quote (USDG), collateral = the stock, oracle = this deployment.
          cast call --rpc-url "$RPC" "$MORPHO_BLUE" "isIrmEnabled(address)(bool)" "$MORPHO_IRM" | grep -q true || { echo "IRM not enabled"; exit 1; }
          cast call --rpc-url "$RPC" "$MORPHO_BLUE" "isLltvEnabled(uint256)(bool)" "$MORPHO_LLTV" | grep -q true || { echo "LLTV not enabled"; exit 1; }
          params="($EXPECTED_QUOTE,$STOCK,$ADDR,$MORPHO_IRM,$MORPHO_LLTV)"
          id=$(cast keccak "$(cast abi-encode "f((address,address,address,address,uint256))" "$params")")
          echo "market id $id"
          receipt=$(cast send --json --rpc-url "$RPC" --private-key "$DEPLOYER_KEY" "$MORPHO_BLUE" \
            "createMarket((address,address,address,address,uint256))" "$params")
          echo "$receipt" | jq -r '"createMarket tx \(.transactionHash) status \(.status)"'
          echo "$receipt" | jq -e '.status == "0x1"' > /dev/null || { echo "createMarket reverted"; exit 1; }
          cast call --rpc-url "$RPC" "$MORPHO_BLUE" "idToMarketParams(bytes32)(address,address,address,address,uint256)" "$id"
          echo "MORPHO_MARKET_ID=$id" >> "$GITHUB_STEP_SUMMARY"
