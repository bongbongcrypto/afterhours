name: deploy

# Manual only. Deploys + activates the contract with cargo-stylus, then runs the
# one-shot `initialize` in the same job (seconds between deployment and
# configuration), then reads the configuration back and fails the job unless
# every field matches the inputs and the feed describes the expected asset.
# Every step is scripts/deploy.sh, which e2e/run.sh also runs against a local
# Nitro node on every push.
# With `reproducible` on (default) the wasm is built in cargo-stylus' Docker
# image so `cargo stylus verify` and the explorer can match the source; off,
# it is built on the runner with `--no-verify`. Optionally creates a Morpho
# Blue market priced by the new oracle.
on:
  workflow_dispatch:
    inputs:
      network:
        description: robinhood-mainnet or robinhood-testnet
        required: true
        default: robinhood-testnet
        type: choice
        options: [robinhood-testnet, robinhood-mainnet]
      feed:
        description: Chainlink feed address for the stock
        required: true
      pools:
        description: Uniswap v3 pool addresses of the stock against the quote, comma-separated (1-3). The first is the primary and prices the asset (give the deepest tier, see assets.json); optional standbys are used only while the primary cannot be observed, and only help if they clear min_liquidity themselves
        required: true
        default: "0xaae0d815ee56e4092a5e5c2911e676fea50b2d6d"
      stock:
        description: Stock token address
        required: true
      expected_description:
        description: What feed.description() must return (measured on mainnet, see DEPLOYMENTS.md)
        required: true
        default: "Robinhood AAPL / USD"
      expected_quote:
        description: The pool's other token, which initialize derives (USDG on Robinhood Chain)
        required: true
        default: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
      expected_decimals:
        description: feed/stock/quote decimals initialize must read back
        required: true
        default: "8/18/6"
      live_max_age:
        description: Seconds a feed answer stays LIVE
        required: true
        default: "21600"
      twap_window:
        description: TWAP window in seconds
        required: true
        default: "1800"
      max_deviation_bps:
        description: Band around the last feed print outside the US regular session (weekdays 14:30-20:00 UTC) and once the feed has missed its heartbeat, basis points
        required: true
        default: "1000"
      heartbeat:
        description: The feed's heartbeat, seconds. During the US regular session a print younger than this is near the market (the feed prints every 0.5% move then), so the pool is held to quiet_band_bps around it
        required: true
        default: "86400"
      quiet_band_bps:
        description: Band around the last feed print during the regular session while it is younger than the heartbeat, basis points (the feed's deviation threshold is 50)
        required: true
        default: "100"
      min_liquidity:
        description: Minimum pool liquidity, the median of three 10-minute harmonic means (AAPL's 0.05% pool holds ~1.7e18 and clears 5e16 from -10.9% to +8.3% of the price)
        required: true
        default: "50000000000000000"
      max_anchor_age:
        description: Oldest feed print the band may anchor to, seconds (5 days covers holiday weekends)
        required: true
        default: "432000"
      reproducible:
        description: Build in cargo-stylus' Docker image so the explorer can verify the source (falls back to --no-verify when off)
        required: true
        default: true
        type: boolean
      morpho_lltv:
        description: If non-empty, also create a Morpho Blue market (loan = quote token, collateral = stock, oracle = AfterHours) at this LLTV in wei, e.g. 625000000000000000 for 62.5%. Leave empty to skip.
        required: false
        default: ""

env:
  CARGO_STYLUS_VERSION: 0.10.9
  # Morpho Blue + AdaptiveCurveIrm on Robinhood Chain (docs.morpho.org addresses page; IRM and
  # the standard LLTVs verified enabled on-chain 2026-09-19).
  MORPHO_BLUE: "0x9D53d5E3bd5E8d4Cbfa6DB1ca238AEA02E651010"
  MORPHO_IRM: "0x2BD3d5965B26B51814AC95127B2b80dD6CcC0fa1"
  MORPHO_LLTV: ${{ inputs.morpho_lltv }}
  NETWORK: ${{ inputs.network }}
  FEED: ${{ inputs.feed }}
  POOLS: ${{ inputs.pools }}
  STOCK: ${{ inputs.stock }}
  EXPECTED_DESCRIPTION: ${{ inputs.expected_description }}
  EXPECTED_QUOTE: ${{ inputs.expected_quote }}
  EXPECTED_DECIMALS: ${{ inputs.expected_decimals }}
  LIVE_MAX_AGE: ${{ inputs.live_max_age }}
  TWAP_WINDOW: ${{ inputs.twap_window }}
  MAX_DEVIATION_BPS: ${{ inputs.max_deviation_bps }}
  MIN_LIQUIDITY: ${{ inputs.min_liquidity }}
  MAX_ANCHOR_AGE: ${{ inputs.max_anchor_age }}
  HEARTBEAT: ${{ inputs.heartbeat }}
  QUIET_BAND_BPS: ${{ inputs.quiet_band_bps }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable   # the read-back parses cast output; no nightly format drift
      - name: cache cargo-stylus
        id: stylus-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-${{ env.CARGO_STYLUS_VERSION }}-${{ runner.os }}
      - name: install cargo-stylus
        if: steps.stylus-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-stylus --version "$CARGO_STYLUS_VERSION" --locked
      - name: lockfile (minimal update; cargo-stylus builds --locked)
        run: cargo update --workspace
      - name: pick endpoint
        id: net
        run: |
          case "$NETWORK" in
            robinhood-mainnet) echo "rpc=https://rpc.mainnet.chain.robinhood.com" >> "$GITHUB_OUTPUT" ;;
            robinhood-testnet) echo "rpc=https://rpc.testnet.chain.robinhood.com" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown network $NETWORK"; exit 1 ;;
          esac
      - name: preflight (every read initialize will make, before any gas is spent)
        id: pre
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: bash scripts/deploy.sh preflight
      - name: deploy + activate
        id: deploy
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          REPRODUCIBLE: ${{ inputs.reproducible }}
        run: bash scripts/deploy.sh deploy
      - name: initialize (fails on a reverted receipt)
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          ADDR: ${{ steps.deploy.outputs.address }}
        run: bash scripts/deploy.sh initialize
      - name: read back and verify every field
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          ADDR: ${{ steps.deploy.outputs.address }}
          DEPLOYER: ${{ steps.pre.outputs.deployer }}
        run: bash scripts/deploy.sh verify
      - name: create a Morpho Blue market priced by AfterHours (optional)
        if: inputs.morpho_lltv != ''
        env:
          RPC: ${{ steps.net.outputs.rpc }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          ADDR: ${{ steps.deploy.outputs.address }}
        run: bash scripts/deploy.sh market
